# ===========================
# Server Configuration
# ===========================
server.port=8080

# ===========================
# MongoDB Atlas Configuration
# ===========================
# Replace YOUR_MONGODB_ATLAS_URI with your actual connection string from MongoDB Atlas
# Format: mongodb+srv://<username>:<password>@<cluster>.mongodb.net/<dbname>?retryWrites=true&w=majority
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=projectmanager

# ===========================
# JWT Configuration
# ===========================
# IMPORTANT: Replace this with a strong 256-bit secretj before deploying!
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ===========================
# Logging
# ===========================
logging.level.com.projectmanager=DEBUG
logging.level.org.springframework.security=INFO
